<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <i class="fas fa-forward skip-icon" id="skipButton"></i>
    <video id="video" src="{{ url_for('static', filename='Gemma.mp4') }}" muted></video>
    <audio id="audio" src="{{ url_for('static', filename='audio.mp3') }}" preload="auto"></audio>

    <button class="play-button" id="playButton">Get Started</button>

    <div class="button-container" id="buttonContainer">
        <div class="button-52" role="button"><a href="python">Python Compiler</a></div>
        <div class="button-52" role="button"><a href="cpp">C++ Compiler</a></div>
        <div class="button-52" role="button"><a href="website">Website Compiler</a></div>
    </div>
    
    <div class="message" id="hello">Hello</div>
    <div class="message" id="welcome">Welcome to Vocal Code</div>
    <div class="message" id="prototype">This application is still in its prototype stage...</div>
    <div class="message" id="options">We have three options for now</div>
    <div class="message" id="compiler">Python Compiler, C++ Compiler, and Website Compiler</div>
    <div class="message" id="choose">What would you like to choose?</div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
